name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type check (tsc + svelte-check)
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          install-dependencies: true

      - name: Desktop UI regression
        run: pnpm test:ui
        env:
          LVCT_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}

      - name: Mobile viewport UI regression
        run: pnpm test:ui:mobile
        env:
          LVCT_TEST_BROWSER: ${{ steps.chrome.outputs.chrome-path }}

      - name: Build
        run: pnpm build

      - name: Release gate
        run: node scripts/check-release.mjs

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          retention-days: 7
          path: |
            dist/
            package.zip
