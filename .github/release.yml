changelog:
  categories:
    - title: "Breaking changes"
      labels:
        - breaking-change
    - title: "Features"
      labels:
        - enhancement
    - title: "Bug fixes"
      labels:
        - bug
    - title: "Data safety"
      labels:
        - data-risk
    - title: "UX and accessibility"
      labels:
        - ux-feedback
        - accessibility
    - title: "Documentation"
      labels:
        - documentation
    - title: "Maintenance"
      labels:
        - dependencies
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
