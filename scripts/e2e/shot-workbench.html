<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>工作台截图</title>
<style id="approx-host-style">
    :root {
        --b3-theme-background: #fff; --b3-theme-surface: #f5f5f5; --b3-theme-surface-lighter: #efefef;
        --b3-theme-on-background: #222; --b3-theme-on-surface: #444; --b3-theme-on-surface-light: #888;
        --b3-theme-primary: #6366f1; --b3-theme-primary-lightest: #e8e9fe; --b3-theme-on-primary: #fff;
        --b3-border-color: #e2e2e2; --b3-list-hover: #eee; --b3-list-icon-hover: #e6e6e6;
        --b3-theme-error: #d32f2f; --b3-theme-success: #23b27c; --b3-theme-info: #3b82f6;
        --b3-font-family: system-ui, sans-serif;
    }
    html[data-theme="dark"] {
        --b3-theme-background: #202124; --b3-theme-surface: #303136; --b3-theme-surface-lighter: #393a40;
        --b3-theme-on-background: #f2f2f3; --b3-theme-on-surface: #d4d5d8; --b3-theme-on-surface-light: #aaaeb5;
        --b3-theme-primary: #7c8aff; --b3-theme-primary-lightest: #343957; --b3-theme-on-primary: #10121d;
        --b3-border-color: #484a50; --b3-list-hover: #383a42; --b3-list-icon-hover: #454751;
    }
    body { margin: 0; background: var(--b3-theme-background); color: var(--b3-theme-on-background); font-family: var(--b3-font-family); }
    #shot { width: 100%; height: 100vh; }
    button, input, select { font: inherit; }
    .fn__flex { display: flex; }
    .fn__flex-1 { flex: 1; }
    .b3-button { border: 0; padding: 7px 12px; background: var(--b3-theme-primary); color: var(--b3-theme-on-primary); cursor: pointer; }
    .b3-button--outline, .b3-button--cancel { background: var(--b3-theme-surface); color: var(--b3-theme-on-background); }
    .b3-text-field, .b3-select { background: var(--b3-theme-background); color: var(--b3-theme-on-background); border: 1px solid var(--b3-border-color); padding: 6px; box-sizing: border-box; }
</style>
<script id="host-baseline-boot">
    /* 宿主样式基线（C01）：?host=1 时注入真实思源 base.css + 官方主题变量，
       并撤下手写近似样式；暗色属性对齐宿主的 data-theme-mode。 */
    (function () {
        const params = new URLSearchParams(location.search);
        const theme = params.get("theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.themeMode = theme;
        if (!params.has("host")) return;
        const link = (href) => {
            const node = document.createElement("link");
            node.rel = "stylesheet";
            node.href = href;
            document.head.appendChild(node);
        };
        link(`/__host/theme-${theme}.css`);
        link("/__host/base.css");
        document.getElementById("approx-host-style")?.remove();
    })();
</script>
</head>
<body>
<div id="shot" class="lvct-tab-root"></div>
<script type="module">
    window.addEventListener("error", (event) => { document.title = `ERROR ${event.message}`; });
    window.addEventListener("unhandledrejection", (event) => { document.title = `ERROR ${event.reason}`; });
    import { mount, tick } from "svelte";
    import "../../src/index.scss";
    import Workbench from "../../src/components/Workbench.svelte";
    import { kernel } from "./ui/siyuan-mock.js";

    const params = new URLSearchParams(location.search);

    if (params.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
    const people = [
        { name: "林晓梅", docId: "20260927000000-person1", itemId: "row-1", group: "家人", phone: "13902257716", tags: ["家人"], birthday: "1990-09-27", related: ["row-2", "row-3"] },
        { name: "陈立群", docId: "20260927000000-person2", itemId: "row-2", group: "同事", phone: "13826110427", tags: ["数学组"], birthday: "1988-10-04", related: ["row-3"] },
        { name: "郑好", docId: "20260927000000-person3", itemId: "row-3", group: "朋友", phone: "13688402253", tags: ["球友"], birthday: "", related: [] },
        { name: "苏婉清 · 跨校联合课程与社区项目协调负责人", docId: "20260927000000-person4", itemId: "row-4", group: "同学", phone: "13755190086", tags: ["校友", "跨校联合课程项目协作", "社区公益活动与长期志愿服务"], birthday: "1991-10-12", related: ["row-2"] },
    ];
    const settings = {
        schemaVersion: 1, notebookName: "小驴人脉", notebookId: "20260927000000-book001",
        hostDocId: "20260927000000-host001", dbBlockId: "20260927000000-block01",
        avId: "20260927000000-view001", initializedAt: "2026-09-27T00:00:00Z",
        fieldMap: Object.fromEntries(FIELD_SPECS.map((field) => [field.key, field.key])),
    };
    const preferences = { ...structuredClone(DEFAULT_VIEW_PREFERENCES), peopleSort: "recent" };
    const summary = (person) => ({ ...person, email: "", wechat: "", website: "", isLunar: false, relatedItemIds: [...person.related] });
    const organizations = [
        { docId: "20261004000000-org0001", name: "曙光教育科技 · 跨校联合课程研究与社区协作中心", hpath: "/组织/曙光教育科技", notebookId: settings.notebookId, archived: false, memberships: [
            { id: "20261004000000-mem0001", orgDocId: "20261004000000-org0001", personDocId: people[1].docId, status: "active", affiliationKind: "work", department: "课程设计与跨校协作研究部", title: "高级课程研究与项目协调负责人", joinedOn: "2024-09-01", leftOn: "" },
            { id: "20261004000000-mem0002", orgDocId: "20261004000000-org0001", personDocId: people[3].docId, status: "active", affiliationKind: "work", department: "社区公益与长期志愿服务项目组", title: "联合项目协调负责人", joinedOn: "2025-03-12", leftOn: "" },
            { id: "20261004000000-mem0003", orgDocId: "20261004000000-org0001", personDocId: people[2].docId, status: "former", affiliationKind: "work", department: "课程推广部", title: "顾问", joinedOn: "2021-06-01", leftOn: "2023-12-31" },
        ] },
        { docId: "20261004000000-org0002", name: "南方师范大学 · 教育学院校友联合会", hpath: "/组织/南方师范大学", notebookId: settings.notebookId, archived: false, memberships: [
            { id: "20261004000000-mem0004", orgDocId: "20261004000000-org0002", personDocId: people[0].docId, status: "active", affiliationKind: "education", department: "教育学院", title: "校友联络人", joinedOn: "2008-09-01", leftOn: "" },
            { id: "20261004000000-mem0005", orgDocId: "20261004000000-org0002", personDocId: people[3].docId, status: "active", affiliationKind: "education", department: "教师教育专业", title: "校友志愿者", joinedOn: "2009-09-01", leftOn: "" },
        ] },
        { docId: "20261004000000-org0003", name: "旧社区读书会（历史组织）", hpath: "/组织/旧社区读书会", notebookId: settings.notebookId, archived: true, memberships: [
            { id: "20261004000000-mem0006", orgDocId: "20261004000000-org0003", personDocId: people[2].docId, status: "former", affiliationKind: "unspecified", department: "活动组", title: "志愿者", joinedOn: "2020-02-01", leftOn: "2022-11-01" },
        ] },
    ];
    const organizationMembers = (docId) => (organizations.find((org) => org.docId === docId)?.memberships ?? [])
        .map((member) => ({ ...member, personName: people.find((person) => person.docId === member.personDocId)?.name ?? "（已解绑）" }));
    kernel.handler = async (route, body) => {
        if (route === "/api/av/renderAttributeView") return { view: {
            columns: FIELD_SPECS.map((field) => ({ id: field.key, name: field.nameZh, type: field.type })),
            rows: people.map((person) => ({ id: person.itemId, cells: [
                { valueType: "block", value: { type: "block", keyID: "name", block: { id: person.docId, content: person.name } } },
                { valueType: "phone", value: { type: "phone", keyID: "phone", phone: { content: person.phone } } },
                { valueType: "text", value: { type: "text", keyID: "wechat", text: { content: person.name === "陈立群" ? "chenliqun88" : "" } } },
                { valueType: "date", value: { type: "date", keyID: "birthday", date: { content: person.birthday ? new Date(`${person.birthday}T00:00:00`).getTime() : 0, isNotEmpty: Boolean(person.birthday) } } },
                { valueType: "select", value: { type: "select", keyID: "group", mSelect: [{ content: person.group }] } },
                { valueType: "mSelect", value: { type: "mSelect", keyID: "tags", mSelect: person.tags.map((tag) => ({ content: tag })) } },
                { valueType: "relation", value: { type: "relation", keyID: "related", relation: { blockIDs: person.related } } },
            ] })),
        } };
        if (route === "/api/graph/getGraph" || route === "/api/graph/getLocalGraph") {
            const nodes = [...people.map((person) => ({ id: person.docId, label: person.name })), ...organizations.filter((org) => !org.archived).map((org) => ({ id: org.docId, label: org.name }))];
            const links = [{ from: people[0].docId, to: people[1].docId }, { from: people[1].docId, to: organizations[0].docId }];
            const ids = route === "/api/graph/getGraph" ? new Set(nodes.map((node) => node.id)) : new Set([body.id, ...links.filter((link) => link.from === body.id || link.to === body.id).flatMap((link) => [link.from, link.to])]);
            return { nodes: nodes.filter((node) => ids.has(node.id)).map((node) => ({ ...node, type: "NodeDocument", refs: 0, defs: 0 })), links: links.filter((link) => ids.has(link.from) && ids.has(link.to)) };
        }
        throw new Error(`截图环境不允许请求 ${route}`);
    };
    const localDateKey = (offsetDays) => {
        const date = new Date(Date.now() + (offsetDays ?? 0) * 86400000);
        const pad = (value) => String(value).padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    };
    /* UX-01.12：facade 按 src/types.ts ContactsPluginFacade 全量实现。
       截图涉及的视图会实际调用：loadDashboard / loadRecentInteractions / loadPersonInsights /
       listPersonFollowUps / getPersonCadence / listTemplates / saveViewPreferences /
       recordInteraction / deleteInteraction / createFollowUp / setFollowUpStatus / snoozeFollowUp。
       其余方法提供无害桩；任何缺失方法都会以运行时错误暴露（页面 title 置 ERROR，截图脚本判失败）。 */
    const followUps = [
        { id: "fu-shot-1", personDocId: people[0].docId, title: "寄生日礼物", dueDate: localDateKey(0), status: "open", createdAt: Date.now() - 3 * 86400000, updatedAt: Date.now() - 3 * 86400000 },
        { id: "fu-shot-2", personDocId: people[1].docId, title: "同步课程评审结论", dueDate: localDateKey(4), status: "open", createdAt: Date.now() - 86400000, updatedAt: Date.now() - 86400000 },
    ];
    const cadenceOverrides = new Map();
    const personNotes = new Map([
        [people[0].docId, "下次见面前提醒带上课程资料。"],
    ]);
    const templates = [
        { id: "tpl-meet", name: "见面", content: "和{{姓名}}见面，聊了……" },
        { id: "tpl-call", name: "电话", content: "和{{姓名}}通电话，主要聊了……" },
        { id: "tpl-party", name: "聚会", content: "在聚会见到{{姓名}}，大家一起……" },
    ];
    const emptyReviewReport = (from, to) => ({
        range: { from, to }, previous: { from, to },
        total: 0, activities: 0, contactedPeople: 0,
        bySource: { manual: 0, diary: 0, api: 0 }, topPeople: [], entries: [],
        previousTotal: 0, delta: 0,
    });
    const facade = {
        listPersonOrgMemberships: async (docId) => organizations.flatMap((org) => org.memberships.filter((member) => member.personDocId === docId)
            .map((member) => ({ ...member, orgName: org.name, archived: org.archived, reachable: true }))),
        listCommonOrgBackground: async () => [],
        listOrganizations: async () => structuredClone(organizations),
        listContacts: async () => people.map(summary),
        loadSelfIdentity: async () => ({ schemaVersion: 1, selfDocId: people[0].docId, selfItemId: people[0].itemId }),
        loadGraphQuerySnapshot: async (query, revision = 0) => {
            const sources = await loadGraphSources(settings, facade, revision);
            const references = query.mode === "native" ? await loadGraphReferences(sources, query) : undefined;
            return buildGraphQuerySnapshot(sources, query, references);
        },
        listOrganizationMembers: async (docId) => organizationMembers(docId),
        listOrganizationMembersPage: async (docId, options = {}) => {
            const all = organizationMembers(docId);
            const query = options.query?.trim().toLocaleLowerCase() ?? "";
            const filtered = query ? all.filter((member) => [member.personName, member.department, member.title].some((value) => value.toLocaleLowerCase().includes(query))) : all;
            return { ...pageOrgMemberships(filtered, options), personDocIds: [...new Set(all.map((member) => member.personDocId))],
                activePersonDocIds: [...new Set(all.filter((member) => member.status === "active").map((member) => member.personDocId))] };
        },
        listPendingOrganizationOperations: async () => [],
        listPersonExchanges: async () => [],
        listPersonAliases: async () => [],
        settings, viewPreferences: preferences, isMobile: innerWidth <= 640,
        loadDashboard: async () => ({
            people: 4, relations: 3, birthdaysThisWeek: 2, neverContacted: 1, neverContactedItemIds: [people[3].itemId],
            birthdays: [{ person: summary(people[0]), bucket: "today", projection: { daysUntil: 0, label: "9月27日" } }, { person: summary(people[1]), bucket: "week", projection: { daysUntil: 7, label: "10月4日" } }],
            stale: [{ person: summary(people[2]), lastDaysAgo: 54 }],
            followUps: followUps.map((item) => ({
                item,
                bucket: item.dueDate < localDateKey(0) ? "overdue" : item.dueDate === localDateKey(0) ? "today" : "upcoming",
                person: summary(people.find((person) => person.docId === item.personDocId)),
                reachable: true,
            })),
            actions: [
                { person: summary(people[0]), bucket: "today", reasons: [
                    { kind: "birthday", label: "今天生日", bucket: "today", dueDate: localDateKey(0) },
                ] },
                { person: summary(people[1]), bucket: "overdue", reasons: [
                    { kind: "followup", label: "跟进「寄生日礼物」已逾期", bucket: "overdue", dueDate: localDateKey(-2), followUpId: "fu-shot-1" },
                ] },
                { person: summary(people[2]), bucket: "stale", reasons: [
                    { kind: "stale", label: "54 天未联系（阈值 30 天）", bucket: "stale" },
                ] },
                { person: summary(people[3]), bucket: "stale", reasons: [
                    { kind: "stale", label: "从未互动", bucket: "stale", neverContacted: true },
                ] },
            ],
        }),
        loadRecentInteractions: async () => Object.fromEntries(people.map((person, index) => [person.docId, { occurredAt: Date.now() - index * 86400000, localDate: `2026-09-${String(27 - index).padStart(2, "0")}` }])),
        loadPersonInsights: async () => ({ timeline: [], coAttendance: [], totalEvents: 0 }),
        loadPersonNote: async (docId) => personNotes.get(docId) ?? "",
        savePersonNote: async (docId, note) => {
            const value = String(note ?? "").replace(/\r\n?/g, "\n").trim();
            if (value) personNotes.set(docId, value); else personNotes.delete(docId);
            return value;
        },
        recordInteraction: async () => {}, deleteInteraction: async () => {},
        listPersonFollowUps: async (docId) => followUps.filter((item) => item.personDocId === docId),
        createFollowUp: async (docId, title, dueDate) => {
            const item = { id: `fu-shot-${followUps.length + 1}`, personDocId: docId, title, dueDate, status: "open", createdAt: Date.now(), updatedAt: Date.now() };
            followUps.push(item);
            return item;
        },
        setFollowUpStatus: async (id, status) => {
            const item = followUps.find((entry) => entry.id === id);
            if (item) { item.status = status; item.updatedAt = Date.now(); }
        },
        snoozeFollowUp: async (id, option, customDate) => {
            const item = followUps.find((entry) => entry.id === id);
            if (!item) return;
            const base = localDateKey(0);
            const offset = option === "tomorrow" ? 1 : option === "threeDays" ? 3 : option === "nextMonday" ? 7 : option === "nextMonth" ? 30 : 0;
            item.dueDate = option === "custom" ? customDate : localDateKey(offset || 1);
            item.updatedAt = Date.parse(base);
        },
        getPersonCadence: async (docId) => cadenceOverrides.get(docId) ?? null,
        savePersonCadence: async (docId, cadence) => {
            if (cadence === null) cadenceOverrides.delete(docId); else cadenceOverrides.set(docId, cadence);
        },
        listTemplates: async () => templates,
        saveTemplates: async (next) => { templates.splice(0, templates.length, ...next); return templates; },
        saveViewPreferences: async (next) => { Object.assign(preferences, next, { revision: preferences.revision + 1 }); return structuredClone(preferences); },
        buildReviewReport: async (from, to) => emptyReviewReport(from, to),
        openPersonDoc() {}, openHostDoc() {}, openDoc() {}, openSettings() {},
        loadViewPreferences: async () => preferences,
        loadExportSummary: async () => ({ people: people.length, interactions: 0 }),
        checkSettingsHealth: async () => ({ ok: true, issues: [], problems: [], fieldMap: settings.fieldMap }),

        repairFieldMap: async () => settings,

        previewInteractionImport: async () => ({}), importInteractionJson: async () => ({}),
        previewInteractionImportDiff: async () => ({}),
        previewFollowUpsImport: async () => ({}), importFollowUpsJson: async () => ({}),
        previewCapture: async () => ({ docId: "", contacts: [] }), captureDoc: async () => ({}),
        aiExtractFromDoc: async () => ({ people: [], date: null, place: null }),
        previewInitialize: async () => ({}), initialize: async () => settings,
    };
    mount(Workbench, { target: document.getElementById("shot"), props: {
        facade, settings, preferences,
        initialView: (view === "home" || view === "quickfill") ? "home" : view === "graph" ? "graph" : view === "orgs" || view === "orgdetail" ? "orgs" : "people",
        isMobile: innerWidth <= 640, onPreferencesUpdated() {}, onOpenPersonDoc() {},
    } });
    async function waitFor(predicate, message) {
        const deadline = Date.now() + 6000;
        while (!predicate()) {
            if (document.title.startsWith("ERROR")) throw new Error(document.title);
            if (Date.now() > deadline) throw new Error(message);
            await new Promise((resolveWait) => setTimeout(resolveWait, 50));
        }
        await tick();
    }
    async function prepareShot() {
        await waitFor(() => document.querySelector(".lvct-workbench"), "工作台未挂载");
        const segToTable = () => [...document.querySelectorAll('.lvct-people__toolbar .lvct-seg__item')].find((b) => b.textContent.includes("表格"));
        if (view === "table" || view === "colmenu") {
            await waitFor(segToTable, "表格切换入口未出现");
            segToTable().click();
        }
        if (view === "peek") {
            await waitFor(() => document.querySelector(".lvct-person-card"), "联系人卡片未出现");
            document.querySelector(".lvct-person-card").click();
        }
        if (view === "orgdetail") {
            const targetCard = () => document.querySelector(`.lvct-orgs-view__card[data-org-doc-id="${organizations[0].docId}"]`);
            await waitFor(targetCard, "目标组织卡片未出现");
            targetCard().querySelector("button").click();
            await waitFor(() => document.querySelector(".lvct-org-manager")?.dataset.orgDocId === organizations[0].docId
                && document.querySelectorAll(".lvct-org-manager__member").length === organizations[0].memberships.length, "组织详情未读取原组织及完整成员");
        }
        if (view === "viewsmenu") {
            if (innerWidth <= 640) {
                const tools = () => document.querySelector('.lvct-people__toolbar button[aria-label="筛选与整理"]');
                await waitFor(tools, "筛选与整理入口未出现");
                tools().click();
                const viewButton = () => document.querySelector('.lvct-sheet button[aria-label="视图"]');
                await waitFor(viewButton, "底部弹层缺少视图入口");
                viewButton().click();
            } else {
                await waitFor(() => document.querySelector('.lvct-people__toolbar button[aria-label="视图"]'), "视图入口未出现");
                document.querySelector('.lvct-people__toolbar button[aria-label="视图"]').click();
            }
        }
        if (view === "morefilter") {
            await waitFor(() => document.querySelector("#lvct-people-moremenu > button"), "更多筛选入口未出现");
            document.querySelector("#lvct-people-moremenu > button").click();
        }
        if (view === "quickfill") {
            await waitFor(() => document.querySelector(".lvct-workbench__header-actions button"), "新建联系人入口未出现");
            document.querySelector(".lvct-workbench__header-actions button").click();
            await waitFor(() => document.querySelector(".lvct-form__toolbar button"), "新建表单未出现");
            document.querySelector(".lvct-form__toolbar button").click();
        }
        if (view === "colmenu") {
            await waitFor(() => document.querySelector('button[aria-label="表格列设置"]'), "表格列设置入口未出现");
            document.querySelector('button[aria-label="表格列设置"]').click();
        }
        let graphSnapshot;
        if (view === "graph") {
            graphSnapshot = await facade.loadGraphQuerySnapshot({ mode: preferences.graphMode, scope: "global", centerDocId: "", orgDocId: "",
                search: "", group: "", isolatedOnly: false, showOrgs: true, depth: "direct", focusId: "", compareId: "", queryMode: "common" });
            if (graphSnapshot.state !== "ready" || graphSnapshot.graph.nodes.length !== people.length + organizations.filter((org) => !org.archived).length) throw new Error("截图图查询来源未完整核实");
            const presentation = innerWidth <= 640 ? "文本视图" : "画布视图";
            [...document.querySelectorAll(".lvct-graph-view button")].find((button) => button.textContent.trim() === presentation).click();
        }
        const expected = view === "home" ? ".lvct-dash__stats"
                : view === "graph" ? innerWidth <= 640 ? ".lvct-graph-text" : ".lvct-graph-view__canvas"
                : view === "orgs" ? ".lvct-orgs-view__card"
                : view === "orgdetail" ? ".lvct-org-manager__member"
                : view === "table" ? ".lvct-people__table-wrap"
                : view === "peek" ? ".lvct-detail"
                : view === "viewsmenu" ? ".lvct-people__viewsmenu"
                : view === "morefilter" ? ".lvct-people__moremenu"
                : view === "quickfill" ? ".lvct-qf__input"
                : view === "colmenu" ? ".lvct-people__colmenu"
                : ".lvct-person-card";
            await waitFor(() => document.querySelector(expected), `缺少截图目标 ${expected}`);
            if (view === "graph") {
                await waitFor(() => {
                    const summary = document.querySelector(".lvct-graph-summary");
                    if (summary?.getAttribute("aria-busy") !== "false") return false;
                    if (innerWidth <= 640) return document.querySelectorAll("[data-graph-id]").length === graphSnapshot.graph.nodes.length;
                    const graph = document.querySelector(expected)?._cyreg?.cy;
                    return graph?.nodes().length === graphSnapshot.graph.nodes.length && graph.edges().length === graphSnapshot.graph.edges.length;
                }, "实际图界面与查询快照不一致");
            }
            if (view === "orgs" && document.querySelectorAll(".lvct-orgs-view__card").length !== organizations.length) throw new Error("组织卡片不完整");
            const alerts = [...document.querySelectorAll('[role="alert"]')]
                .filter((element) => element.offsetParent !== null && element.textContent.trim());
            if (alerts.length) throw new Error(`banner: ${alerts[0].textContent.trim().slice(0, 80)}`);
            const clipped = [...document.querySelectorAll(".lvct-people__toolbar, .lvct-detail__header-actions")]
                .some((element) => element.getBoundingClientRect().right > innerWidth + 2);
            if (clipped) throw new Error(`clipped toolbar ${innerWidth} ${[...document.querySelectorAll(".lvct-people__toolbar, .lvct-detail__header-actions")].map((element) => Math.round(element.getBoundingClientRect().right)).join(",")}`);
            if (!document.title.startsWith("ERROR")) document.title = "READY";
    }
    void prepareShot().catch((error) => { document.title = `ERROR ${error instanceof Error ? error.message : String(error)}`; });
</script>
</body>
</html>
