<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>设置页截图</title>
<style id="approx-host-style">
    :root {
        --b3-theme-background: #fff; --b3-theme-surface: #f5f5f5;
        --b3-theme-surface-lighter: #efefef;
        --b3-theme-on-background: #222; --b3-theme-on-surface: #444;
        --b3-theme-on-surface-light: #888; --b3-theme-primary: #6366f1;
        --b3-theme-primary-lightest: #e8e9fe; --b3-theme-on-primary: #fff;
        --b3-border-color: #e2e2e2; --b3-list-hover: #eee;
        --b3-list-icon-hover: #e6e6e6; --b3-theme-error: #d32f2f;
        --b3-theme-success: #23b27c; --b3-theme-info: #3b82f6;
        --b3-font-family: inherit;
    }
    body { margin: 0; background: var(--b3-theme-background); color: var(--b3-theme-on-background); }
    #shot { width: 100%; min-height: 100vh; }
    button, input, select { font: inherit; }
    .fn__flex { display: flex; }
    .fn__flex-1 { flex: 1; }
    .b3-button { border: 0; padding: 7px 12px; background: var(--b3-theme-primary); color: var(--b3-theme-on-primary); cursor: pointer; }
    .b3-button--outline, .b3-button--cancel { background: var(--b3-theme-surface); color: var(--b3-theme-on-background); }
    .b3-text-field, .b3-select { background: var(--b3-theme-background); color: var(--b3-theme-on-background); border: 1px solid var(--b3-border-color); padding: 6px; box-sizing: border-box; }
    html[data-theme="dark"] { --b3-theme-background: #202124; --b3-theme-surface: #303136; --b3-theme-surface-lighter: #393a40; --b3-theme-on-background: #f2f2f3; --b3-theme-on-surface: #d4d5d8; --b3-theme-on-surface-light: #aaaeb5; --b3-theme-primary: #7c8aff; --b3-theme-primary-lightest: #343957; --b3-theme-on-primary: #10121d; --b3-border-color: #484a50; --b3-list-hover: #383a42; --b3-list-icon-hover: #454751; }
</style><script id="host-baseline-boot">
    /* 宿主样式基线（C01）：?host=1 时注入真实思源 base.css + 官方主题变量，
       并撤下手写近似样式；暗色属性对齐宿主的 data-theme-mode。 */
    (function () {
        const params = new URLSearchParams(location.search);
        const theme = params.get("theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.themeMode = theme;
        if (!params.has("host")) return;
        const link = (href) => {
            const node = document.createElement("link");
            node.rel = "stylesheet";
            node.href = href;
            document.head.appendChild(node);
        };
        link("/__host/theme-" + theme + ".css");
        link("/__host/base.css");
        document.getElementById("approx-host-style")?.remove();
    })();
</script></head>
<body>
<div id="shot" class="lvct-tab-root"></div>
<script type="module">
    import { mount, unmount } from "svelte";
    import "../../src/index.scss";
    import SettingsView from "../../src/components/SettingsView.svelte";

    const settings = {
        schemaVersion: 1, notebookName: "小驴人脉", notebookId: "book1",
        hostDocId: "host1", dbBlockId: "block1", avId: "av1",
        initializedAt: "2026-09-27T00:00:00Z",
        fieldMap: { name: "c1", phone: "c2", email: "c3", wechat: "c4", website: "c5", birthday: "c6", isLunar: "c7", group: "c8", tags: "c9" },
    };
    const prefs = {
        defaultView: "home", peopleSort: "name", openOnStartup: true,
        birthdayWindowDays: 7, staleThresholdDays: 30, aiEnabled: true,
    };
    const columns = [
        { id: "c1", name: "姓名", type: "text" },
        { id: "c2", name: "电话", type: "phone" },
        { id: "c3", name: "邮箱", type: "text" },
        { id: "c4", name: "微信", type: "text" },
        { id: "c5", name: "网站", type: "url" },
        { id: "c6", name: "生日", type: "date" },
        { id: "c7", name: "农历", type: "checkbox" },
        { id: "c8", name: "分组", type: "select" },
        { id: "c9", name: "标签", type: "mSelect" },
    ];
    const facade = {
        settings, viewPreferences: prefs,
        checkSettingsHealth: async () => ({ ok: true, columns: columns.length, missing: [], availableColumns: columns }),
        runHealthAudit: async () => [],
        repairFieldMap: async (patch) => ({ ...settings, fieldMap: { ...settings.fieldMap, ...patch } }),
        rebuildMissingFields: async () => settings,
        rebindSettings: async () => settings,
        saveViewPreferences: async (v) => v,
        exportInteractionJson: async () => "{}",
        openHostDoc() {},
    };

    const params = new URLSearchParams(location.search);
    const mode = params.get("section") || "general";
    if (params.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
    let app = mount(SettingsView, {
        target: document.getElementById("shot"),
        props: {
            facade, settings, preferences: prefs,
            onSettingsUpdated() {}, onPreferencesUpdated() {}, onBack() {},
        },
    });
    // Switch to requested section after mount.
    setTimeout(() => {
        const labels = { data: "数据与字段", reminder: "提醒", ai: "AI 与隐私", bridge: "服务桥", about: "关于" };
        if (labels[mode]) {
            const btn = [...document.querySelectorAll(".lvct-settings__nav-item")].find((n) => n.textContent.includes(labels[mode]));
            btn?.click();
        }
        document.title = "READY";
    }, 100);
    window.__ready = true;
</script>
</body>
</html>
